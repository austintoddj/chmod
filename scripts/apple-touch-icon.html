<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 180px;
        height: 180px;
        display: grid;
        place-items: center;
        background: #0a0b0f;
      }
      .tile {
        width: 148px;
        height: 148px;
        border-radius: 36px;
        display: grid;
        place-items: center;
        background: #0a0b0f;
        border: 2px solid #2a2d38;
        box-shadow: 0 0 0 1px rgba(61, 214, 140, 0.08);
      }
      span {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 42px;
        font-weight: 600;
        color: #3dd68c;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="tile"><span>755</span></div>
  </body>
</html>
